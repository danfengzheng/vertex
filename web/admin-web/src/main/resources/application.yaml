server:
  port: 8080

spring:
  application:
    name: vertex
  profiles:
    active: dev
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.vertex.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Knife4j
knife4j:
  enable: true
  openapi:
    title: Vertex后台管理系统API
    version: 1.0.0
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.vertex.admin.controller
          - com.vertex.admin.web.controller
          - com.vertex.service.quote.controller
          - com.vertex.service.strategy.controller
          - com.vertex.service.order.controller

# 系统配置
vertex:
  i18n:
    # 是否开启多语言key自动拼接
    enable: false
    # 多语言key连接符
    separator: "."
  token:
    # Token前缀，默认为 "Bearer "
    prefix: "Bearer "
    # Token请求头，默认为 "Authorization"
    header: "Authorization"
  jwt:
    # JWT 签名密钥（生产环境请使用环境变量 VERTEX_JWT_SECRET）
    secret: ${VERTEX_JWT_SECRET:vertex-admin-secret-key-change-in-production}
    # 过期时间（秒），默认 24 小时
    expiration-seconds: ${VERTEX_JWT_EXPIRATION:86400}
  crypto:
#    key: ${VERTEX_CRYPTO_KEY:"pl8LbcpdRsc5AbYphlxM9inSFbhajqJ+oHLUJbJFSP0="}
    key: pl8LbcpdRsc5AbYphlxM9inSFbhajqJ+oHLUJbJFSP0=
  quote:
    subscription:
      # kline=仅订阅K线流（与回测/信号一致）  trade=日K以下trade流+内存聚合（默认）
      mode: ${VERTEX_QUOTE_SUBSCRIPTION_MODE:trade}
  strategy:
    enabled: true
    rocksdb:
      data-dir: ./data/rocksdb/strategy
    engine:
      max-kline-history: 500
      only-closed-klines: true
  trading:
    enabled: true
    default-execution-mode: PAPER
    binance:
      api-url: https://api.binance.com
      recv-window: 5000
    telegram:
      enabled: true
      bot-token: 8568350639:AAFb2uRyP705t29P53pfGnpspCxNxKagSx0
      chat-id: -1003829666749