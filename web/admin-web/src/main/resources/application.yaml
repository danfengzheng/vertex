server:
  port: 8080

spring:
  application:
    name: vertex
  profiles:
    active: dev
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.vertex.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Knife4j
knife4j:
  enable: true
  openapi:
    title: Vertex后台管理系统API
    version: 1.0.0
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.vertex.admin.controller
          - com.vertex.admin.web.controller
          - com.vertex.service.quote.controller
          - com.vertex.service.strategy.controller
          - com.vertex.service.order.controller
          - com.vertex.service.chain.controller

# 系统配置
vertex:
  i18n:
    # 是否开启多语言key自动拼接
    enable: false
    # 多语言key连接符
    separator: "."
  token:
    # Token前缀，默认为 "Bearer "
    prefix: "Bearer "
    # Token请求头，默认为 "Authorization"
    header: "Authorization"
  jwt:
    # JWT 签名密钥（生产环境请使用环境变量 VERTEX_JWT_SECRET）
    secret: ${VERTEX_JWT_SECRET:vertex-admin-secret-key-change-in-production}
    # 过期时间（秒），默认 24 小时
    expiration-seconds: ${VERTEX_JWT_EXPIRATION:86400}
  crypto:
#    key: ${VERTEX_CRYPTO_KEY:"pl8LbcpdRsc5AbYphlxM9inSFbhajqJ+oHLUJbJFSP0="}
    key: pl8LbcpdRsc5AbYphlxM9inSFbhajqJ+oHLUJbJFSP0=
  quote:
    subscription:
      # kline=仅订阅K线流（与回测/信号一致）  trade=日K以下trade流+内存聚合（默认）
      mode: ${VERTEX_QUOTE_SUBSCRIPTION_MODE:kline}
    # ===== 成交量暴增扫描器 - 基础设施配置（重启生效）=====
    # 业务参数（开关、阈值、扫描间隔、Telegram 凭据等）在数据库 volume_surge_config 单行表中，
    # 可以在 UI「行情管理 → 成交量暴增」页面热切换，不需要重启。
    # 本 yaml 段只放不可热改的基础设施参数。
    volume-surge:
      # bean 级安装开关：true 后 scanner 相关 bean 注册；false 则彻底禁用（UI 也无法打开）。
      # 生产建议设 true，实际开/关走 DB。
      enabled: ${VERTEX_VOLUME_SURGE_ENABLED:true}
      api-url: ${VERTEX_VOLUME_SURGE_API_URL:https://api.binance.com}
      # 扫描器心跳周期（秒）；每次心跳查一次 DB 配置，到期后触发一次真正扫描。
      # DB 配置改动后最多等 tick-interval-seconds 秒生效。
      tick-interval-seconds: 60
      # 启动后首次心跳延迟（秒），让主服务预热完再扫。
      initial-delay-seconds: 60
      # 单次扫描并发 REST 上限。
      max-concurrent-requests: 8
      # X-MBX-USED-WEIGHT-1M 达到即主动 sleep（保护限流）。
      weight-soft-limit: 4000
      soft-limit-pause-seconds: 15
  strategy:
    enabled: true
    rocksdb:
      data-dir: ./data/rocksdb/strategy
    engine:
      max-kline-history: 500
      only-closed-klines: true
    telegram:
      enabled: true
#      bot-token: ${VERTEX_STRATEGY_TG_BOT_TOKEN:8568350639:AAFb2uRyP705t29P53pfGnpspCxNxKagSx0}
#      chat-id: ${VERTEX_STRATEGY_TG_CHAT_ID:-1003829666749}
      bot-token: 8568350639:AAFb2uRyP705t29P53pfGnpspCxNxKagSx0
      chat-id: -1003829666749
      api-url: https://api.telegram.org
  ai:
    # ===== AI 分析配置（多 Provider 切换）=====
    # 第一阶段：仅做 AI 分析，不参与决策；异步执行，失败不影响交易主流程。
    #
    # 切换 provider：
    #   provider=gemini   → 用 Google Gemini（默认）
    #   provider=deepseek → 用 DeepSeek（OpenAI 兼容协议，国内可直连）
    # 改 provider 或 model 后必须**重启服务**才生效（Spring 配置绑定是启动期）。
    # 重启后看日志 "[AiAnalysisService] activated: provider=X, model=Y" 验证生效。
    provider: ${VERTEX_AI_PROVIDER:gemini}
    # 通用参数（所有 provider 共享）
    worker-threads: 2
    queue-capacity: 2000
    # AI 自由文本输出语言（zh-CN / en / ja / ko ...）。
    # 仅影响 summary / keyFactors / risks / entryFactors / exitFactors / improvements
    # 这些自由文本字段；verdict / alignment 等枚举值始终是英文 key（前端 i18n 翻译）。
    language: ${VERTEX_AI_LANGUAGE:zh-CN}

    # ----- Google Gemini -----
    # 欧洲部署可直连；中国大陆部署建议 base-url 配 Cloudflare Worker 反代。
    gemini:
      enabled: ${VERTEX_AI_GEMINI_ENABLED:false}
      # 在 https://aistudio.google.com/app/apikey 申请，免费层 1500 次/天
      api-key: ${VERTEX_AI_GEMINI_API_KEY:}
      # gemini-2.0-flash（便宜快，免费层够用） / gemini-2.5-pro（高质量但慢）
      model: ${VERTEX_AI_GEMINI_MODEL:gemini-2.0-flash}
      # 默认官方 endpoint；如需反代改为 https://your-cf-worker.example.com
      base-url: ${VERTEX_AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      timeout-seconds: 30
      max-retry: 2

    # ----- DeepSeek（OpenAI 兼容协议）-----
    # 国内可直连 api.deepseek.com，无需反代。在 platform.deepseek.com 申请 API Key。
    deepseek:
      enabled: ${VERTEX_AI_DEEPSEEK_ENABLED:false}
      api-key: ${VERTEX_AI_DEEPSEEK_API_KEY:}
      # deepseek-chat（V3 通用，快） / deepseek-reasoner（R1 推理，强但慢、贵）
      model: ${VERTEX_AI_DEEPSEEK_MODEL:deepseek-chat}
      base-url: ${VERTEX_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      timeout-seconds: 60
      max-retry: 2
  trading:
    enabled: true
    default-execution-mode: PAPER
    binance:
      api-url: https://api.binance.com
      recv-window: 5000
    slippage:
      enabled: true
    telegram:
      enabled: false
      bot-token: 8568350639:AAFb2uRyP705t29P53pfGnpspCxNxKagSx0
      chat-id: -1003829666749
  chain:
    enabled: true
    scan-interval-seconds: 300
    max-jitter-seconds: 600
    min-score-to-save: 20
    # https://etherscan.io/ zhaoxu725
    bnb:
      enabled: true
      bscscan-api-key: Z82E7M1QGB9J9R4WFFTRYRUDZN9HUJTRHK
      scan-window-minutes: 30
      min-liquidity-usd: 1000
    # https://dashboard.helius.dev/ zhaoxu
    solana:
      enabled: true
      helius-api-key: f42ba6b9-d647-4305-afdd-cf3a236770cb
      scan-window-minutes: 30
      min-liquidity-usd: 500
    # Binance Alpha 山寨币潜力筛选（enabled=false 默认关闭，按需开启）
    binance-alpha:
      enabled: true
      api-url: https://www.binance.com
      page-size: 50
      min-market-cap-usd: 500000
      min-liquidity-usd: 10000
    # BSC DEX 趋势动量筛选（enabled=false 默认关闭，按需开启）
    bsc-trending:
      enabled: true
      min-volume-liquidity-ratio: 0.3
      min-liquidity-usd: 5000
      min-market-cap-usd: 100000
      max-market-cap-usd: 50000000
      min-price-change-1h-pct: 0.0
      limit: 50
    telegram:
      enabled: true
      bot-token: ${VERTEX_CHAIN_TG_BOT_TOKEN:8568350639:AAFb2uRyP705t29P53pfGnpspCxNxKagSx0}
      chat-id: ${VERTEX_CHAIN_TG_CHAT_ID:-1003829666749}
      api-url: https://api.telegram.org