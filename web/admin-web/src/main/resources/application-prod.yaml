spring:
  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/vertex?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    #    password: root123
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20

vertex:
  mm:
    enabled: true
    paper:
      queue_loss_factor: 0.5    # 只填充 real trade qty 的 50%（模拟排队损失）
      gtx_reject_rate: 0.05     # 5% 挂单随机拒绝（模拟 GTX）
      latency_ms: 200           # 模拟 REST 延迟