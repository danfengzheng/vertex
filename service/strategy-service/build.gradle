description = 'strategy-service - 策略服务'

dependencies {
    // 内部依赖
    implementation project(':api')
    implementation project(':model')
    implementation project(':common:common-core')
    implementation project(':common:common-web')
    implementation project(':service:quote-service')

    // Spring Boot
    implementation libs.spring.boot.starter

    // WebSocket（可选，用于信号实时推送）
    compileOnly 'org.springframework:spring-messaging'

    // MyBatis Plus
    implementation libs.mybatis.plus.boot.starter

    // RocksDB
    implementation libs.rocksdb

    // JSON
    implementation libs.fastjson2

    // 配置处理
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // 测试
    testImplementation libs.spring.boot.starter.test
}
